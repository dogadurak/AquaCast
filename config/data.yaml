aoi:
  name: konya_closed_basin
  bbox: [31.4, 36.7, 35.2, 39.4]      # W, S, E, N (EPSG:4326) - availability probing only
  boundary_source: WWF/HydroSHEDS/v1/Basins/hybas_5
  hybas_id: 2050085960                # the only ENDO=2 (endorheic sink) polygon over the AOI
  area_km2_hydrobasins: 58374        # attribute 58373.7; geodesic recompute 58373.9
  official_area_km2_text: 49805.34   # SYGM page, prose
  official_area_km2_table: 50028     # SYGM page, table
  official_area_source: >
    T.C. Tarim ve Orman Bakanligi, Su Yonetimi Genel Mudurlugu - Konya Kapali
    Havzasi. https://www.tarimorman.gov.tr/SYGM/Sayfalar/Detay.aspx?SayfaId=135
    The page gives 49,805.34 km2 in prose and 50,028 km2 in its table; both are
    recorded because the project should not silently pick the more convenient one.
  area_caveat: >
    HydroBASINS level 5 delineates 58,374 km2 against an official 49,805-50,028
    km2 - a delineation difference of about +17%, not rounding. HydroBASINS is
    derived from HydroSHEDS flow directions, and endorheic basins are precisely
    where that derivation is weakest: with no outlet, the boundary depends on
    sink-filling choices. PROJECT_SPEC already marked HydroBASINS a fallback.
    Any basin-total figure inherits this difference and must say so.

  # MEASURED, not assumed: the HydroBASINS L5 polygon is a merge of NINE distinct
  # HydroSHEDS level-6 endorheic sinks, and the +17% excess is almost exactly one
  # of them - MAIN_BAS 2060086420, 8,096 km2, spanning 30.00-31.83 E / 38.06-39.13 N.
  # That is the Aksehir-Eber lake system, i.e. the AKARCAY closed basin, which the
  # ministry lists as a neighbour of Konya, not part of it (published Akarcay
  # drainage area ~7,400 km2).
  #
  # Dropping it alone gives 50,278 km2: +0.95% against the official prose figure and
  # +0.50% against the table figure. Every other single sub-basin is at least 7.5%
  # off, so the match is not one of many possible coincidences.
  #
  # This is a hypothesis supported by area and geography, NOT a verified geometry
  # match - the official polygon is still not in hand.
  akarcay_lobe_main_bas: 2060086420
  akarcay_lobe_area_km2: 8096
  akarcay_published_area_km2: 7400

  # Which membership column selects the cells used for analysis. Changing the
  # boundary is a config change, not a re-export: see grid.buffer_cells.
  # Available columns, cheapest to most faithful:
  #   in_hydrobasins                     as delivered, includes the Akarcay lobe
  #   in_hydrobasins AND NOT in_akarcay_lobe   provisional best approximation
  #   in_official                        added when the DSI/SYGM geometry arrives
  membership_column: in_hydrobasins

grid:
  # DESIGN RULE - forecast at the resolution the physics supports; observe at the
  # resolution the sensor provides. See PROJECT_SPEC.md section 2.3.
  #
  # The modelling grid IS the CHIRPS grid: its own 0.05 degree lon/lat lattice, not
  # a metric 5 km grid. Reprojecting onto a metric grid would resample the one
  # variable that must stay untouched, because SPI is computed from it.
  analysis:
    name: chirps_native
    crs: EPSG:4326
    resolution_deg: 0.05
    reference_collection: UCSB-CHC/CHIRPS/V3/PENTAD
    nominal_scale_m: 5566             # informational only - never a reprojection target
    cells_in_basin: 2395              # measured; cells whose centre falls in the polygon
    cells_after_mask: 2130            # crop_frac_2021 >= 0.5, an ANALYSIS filter not an export one
    months_1981_2025: 540

  # Export one extra cell ring beyond the basin. The official boundary is ~17%
  # SMALLER than HydroBASINS, so it almost certainly lies INSIDE it - which makes a
  # boundary revision a filter rather than a re-download. The ring covers the case
  # where it does not, at a cost of a few percent more cells.
  #
  # Membership is a COLUMN, never a row filter. Nothing is dropped at export time:
  #   in_hydrobasins   bool   cell centre inside the HydroBASINS polygon
  #   in_official      bool   added later, when the official boundary is obtained
  #   crop_frac_2021   float  cropland/rangeland fraction as of the 2021 WorldCover epoch
  # Analysis selects rows via aoi.membership_column and mask.min_fraction.
  buffer_cells: 1

  # Every forecast, every baseline and every skill metric is produced on the
  # analysis grid, Tier 1 and Tier 2 alike. No exceptions.
  forecast_grid: analysis

  resampling:
    precip_chirps: none               # native grid, untouched
    era5_land: bilinear               # 9 km -> 0.05 deg
    modis_1km: aggregate_mean_sd      # 1 km -> 0.05 deg, mean AND standard deviation

  observation:
    # Monitoring layers keep their native resolution and are never the forecast grid.
    modis:
      resolution_m: 1000
      role: >
        Monitoring and inspection only. Before entering the model these are
        aggregated to the analysis grid as mean and standard deviation, so that
        within-cell heterogeneity - itself a drought signal - is carried forward
        rather than averaged away.

  resolution_mismatch:
    # A 0.05 deg cell fed by 9 km ERA5-Land carries 9 km information. Recorded here
    # because it must be stated in the UI and the model card, not discovered later.
    precip_chirps_mm: native 0.05 deg
    precip_era5_mm: 9 km resampled to 0.05 deg
    t2m_c: 9 km resampled to 0.05 deg
    pet_mm: 9 km resampled to 0.05 deg
    swvl1_4: 9 km resampled to 0.05 deg
    ndvi_lst_et: 1 km aggregated to 0.05 deg

  mask:
    landcover_classes: [30, 40]       # ESA WorldCover: 30 grassland, 40 cropland
    column: crop_frac_2021            # the epoch is IN THE NAME - the mask is one year, the panel is 45
    min_fraction: 0.5                 # ANALYSIS threshold, applied at model time - never an export filter
    threshold_sensitivity: >
      Cell counts at thresholds 0.2 / 0.3 / 0.5 are 2279 / 2256 / 2130. The result
      is insensitive to the threshold because the basin is overwhelmingly cropland
      and rangeland; 0.5 is chosen as "the majority of the cell", the statement
      easiest to defend.
    fraction_estimator: >
      Cropland fraction is estimated from a regular 100 m subsample of the 10 m
      WorldCover grid (~3,100 samples per 0.05 deg cell, standard error under 1%).
      A full 10 m aggregation exceeds the interactive memory limit; the subsample
      is an unbiased estimator of the same quantity.
    static_epoch_caveat: >
      WorldCover v200 is a single 2021 epoch applied as a static mask across
      1981-2025. Cropland extent in the basin has changed over that period, so the
      mask reflects 2021 land use, not the land use contemporaneous with each row.

period:
  start: 2001-01-01
  end: 2025-12-31
  # Index and anomaly fitting reaches further back than MODIS does - see
  # climatology.baseline_precip_era5. CHIRPS and ERA5-Land are exported from 1981;
  # MODIS-derived columns are null before 2001 and carry *_available flags.
  export_start: 1981-01-01
  export_end: 2025-12-31

climatology:
  # TWO reference periods, because MODIS does not reach as far back as
  # CHIRPS/ERA5-Land. Both lie strictly inside the training window: neither
  # touches validation (2018-2020) or test (2022-2025).
  # Enforced by tests/test_leakage.py::test_baseline_periods_exclude_val_and_test.
  #
  # This supersedes the 1991-2020 WMO normal named in the earlier draft spec.
  # That period was unusable here on two counts: it is not a subset of the
  # training window (train ends 2016), and it overlaps the validation years,
  # so every anomaly computed against it would carry validation-period
  # statistics into training. See PROJECT_SPEC.md section 4.2.
  baseline_precip_era5:
    start: 1981-01-01
    end: 2016-12-31
    applies_to:
      - precip_chirps_mm
      - precip_era5_mm
      - t2m_c
      - pet_mm
      - swvl1
      - swvl2
      - swvl3
      - swvl4
      - spi_1
      - spi_3
      - spi_6
      - spi_12
      - spei_3
      - spei_6
      - sm_anom
    note: >
      36 years, above the WMO-recommended 30-year minimum for stable gamma
      fits. Start year is the CHIRPS record start; ERA5-Land reaches 1950 but
      is truncated to match so that both precipitation products share one
      reference period.
    caveat: >
      Beginning in 1981 includes pre-warming years, so recent anomalies read
      drier than they would against a later normal. This is not an error - a
      longer normal is the statistically better choice - but it must be stated
      wherever anomalies are reported. Recorded in reports/model_card.md.
  baseline_modis:
    start: 2001-01-01
    end: 2016-12-31
    applies_to:
      - ndvi
      - ndvi_sd
      - et_mm
      - pet_modis_mm
      - lst_day_c
      - lst_day_c_sd
      - ndvi_anom
      - lst_anom
    note: >
      16 years only - MODIS begins in 2000 and 2001 is its first full year.
      Below the 30-year guidance. Documented as a limitation in
      docs/data_dictionary.md and reports/model_card.md rather than hidden.

sources:
  precipitation_primary: UCSB-CHC/CHIRPS/V3/PENTAD
  reanalysis: ECMWF/ERA5_LAND/MONTHLY_AGGR
  ndvi: MODIS/061/MOD13A2
  ndvi_successor: NASA/VIIRS/002/VNP13A1
  evapotranspiration: MODIS/061/MOD16A2GF
  lst: MODIS/061/MOD11A2
  landcover: ESA/WorldCover/v200
  dem: USGS/SRTMGL1_003
  terrestrial_water_storage: NASA/GRACE/MASS_GRIDS_V04/MASCON_CRI

era5_bands:
  # Exact band names verified against the collection, not assumed.
  t2m_c: temperature_2m                       # K -> degC
  precip_era5_mm: total_precipitation_sum     # m -> mm
  pet_mm: potential_evaporation_sum           # m -> mm, sign flipped (ERA5 PET is negative)
  swvl1: volumetric_soil_water_layer_1
  swvl2: volumetric_soil_water_layer_2
  swvl3: volumetric_soil_water_layer_3
  swvl4: volumetric_soil_water_layer_4

gee:
  project: mythic-brook-481108-h7   # override with the EE_PROJECT environment variable

export:
  chunk_by: year                 # file granularity
  request_by: month              # request granularity - 12 requests per file
  method: compute_features       # direct paginated fetch; Drive export is the fallback
  raw_dir: data/raw
  max_retries: 5
  backoff_base_seconds: 2
  drive_folder: aquacast_exports # only used by the Drive fallback
