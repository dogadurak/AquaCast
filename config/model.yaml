targets:
  # (target, lead) pairs must not overlap their predictor window.
  #
  # SPI-3 is PRIMARY as of the T5 pre-flight diagnostic. Moving SPI-1 by one unit
  # takes only 2.0 mm in August and 3.3 mm in July - below what CHIRPS resolves over
  # this basin - so summer SPI-1 reports product behaviour rather than meteorology.
  # SPI-3's weakest month needs 10.1 mm and it never approaches that regime.
  # See reports/spi_reliability_note.md.
  - name: spi_3
    lead_months: 3
    tier: 2
    role: primary
    kind: classification      # P(SPI-3 < -1)
    threshold: -1.0
  - name: spi_1
    lead_months: 1
    tier: 1
    role: secondary
    kind: regression
    # Never pool across months for this target: pooling averages the summer
    # degradation into the robust winter months and hides it.
    report_by_calendar_month: true
  - name: sm_anom
    lead_months: 1
    tier: 1
    role: secondary
    kind: regression

spi_reliability:
  # THE MEASUREMENT LIVES IN THE PANEL, THE DECISION LIVES HERE.
  # spi1_mm_per_unit and spi3_mm_per_unit are computed for every (cell, calendar
  # month) and stored - they are measured quantities, correct without any threshold.
  #
  # Skill is reported binned by sensitivity rather than gated by a cut point, so the
  # curve shows where degradation begins instead of asserting where it does. Same
  # pattern as aoi.membership_column: bake the measurement into the data, keep the
  # decision in config, so revising it is a config change and not a recomputation.
  sensitivity_column_spi1: spi1_mm_per_unit
  sensitivity_column_spi3: spi3_mm_per_unit
  report_bins_mm: [0, 3, 5, 10, 1000]
  # Optional derived flag for filtering and for the interface. PROVISIONAL and
  # descriptive: no measured CHIRPS uncertainty at low monthly amounts exists yet.
  # Draw it on the sensitivity curve once the MGM station comparison supplies one.
  unreliable_below_mm: 5.0
  unreliable_flag_is_derived_at_analysis_time: true

split:
  train: [2001-01-01, 2016-12-31]
  gap_1: [2017-01-01, 2017-12-31]     # gap >= longest accumulation window
  validation: [2018-01-01, 2020-12-31]
  gap_2: [2021-01-01, 2021-12-31]
  test: [2022-01-01, 2025-12-31]

baselines:
  - climatology
  - persistence
  - known_accumulation      # the anti-leakage control - mandatory
  - c3s_raw                 # tier 2 only - not yet available, see c3s_raw_status below

c3s_raw_status:
  # C3S is not silently dropped from the skill table when unavailable - CLAUDE.md
  # rule 1 forbids a bare metric, but omitting the row entirely is its own kind of
  # concealment. The row always exists; its value is null with this reason attached.
  available: false
  reason: "CDS access pending - see reports/phase0_log.md open items (list B)"

persistence_auc_note: >
  Persistence's probability forecast is CALIBRATED, not a hard 0/1 step function:
  P(target < threshold, lead months ahead | target < threshold lead-months-ago, the
  value known at issue time), fit basin-wide on the reference period and applied
  unchanged - see src/models/baselines.py persistence_probability_forecast. A hard
  0/1 form was used through the first T8 run; the skeptic audit found it was a
  quadratic-scoring-rule worst case that inflated "model beats persistence" from a
  real margin into mostly an artefact of an uncalibrated baseline. Recalibrating
  moved spi_3@+3's model_bss (the model's Brier Skill Score against persistence,
  see src/eval/skill.py skill_score) from +0.377 (hard 0/1) to -0.048 (calibrated,
  after also fixing a leak the recalibration itself introduced and this project's
  own "better than expected -> suspect a leak first" rule caught - see
  reports/phase0_log.md): the model does not beat a properly calibrated persistence
  at this target either, which the hard-0/1 baseline was hiding. AUC is still
  coarser than a continuous forecast's because the basin-wide fit yields only two
  distinct probability values (one per current state) rather than a per-cell
  continuum - that remaining coarseness is a property of pooling for sample size,
  not of thresholding, and not a defect.

known_accumulation_note: >
  For every approved (target, lead) pair in PROJECT_SPEC.md section 4.1, overlap
  with the observed accumulation window is zero (k - L = 0 for spi_1@+1, spi_3@+3,
  sm_anom@+1, ndvi_anom@+1). Under zero overlap, known-accumulation has nothing
  observed to condition on and reduces exactly to climatology - so the two columns
  in the skill table being numerically identical is the expected, designed
  consequence of section 4.1 (Problem 1's fix), not a bug or a duplicated
  computation. Verified independently rather than assumed: see
  tests/test_leakage.py::test_known_accumulation_baseline_matches_climatology_numerically.
  If a future (target, lead) pair has nonzero overlap, this note and that test's
  expectation both stop applying and must be revised together.

model:
  primary: xgboost
  crosscheck: lightgbm
  seed: 42

evaluation:
  aggregate: per_forecast_date     # never pool across all rows
  report_by: [lead, landcover, cell]
  metrics_regression: [mae, rmse, r2, skill_score]
  metrics_probabilistic: [brier_skill_score, roc_auc, reliability]
  spatial_blocked_cv: true
  permutation_test: true
